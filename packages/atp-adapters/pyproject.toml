# Internal build unit — NOT published to PyPI. Its code ships inside the
# atp-platform wheel (atp/ holds symlinks that hatchling dereferences at
# build time), and its runtime requirements are declared in the root
# pyproject.toml. The name "atp-adapters" is unclaimed on PyPI, and
# atp-platform 2.1.0 shipped depending on it — an install error for every user
# until it was removed.
# The Private classifier below makes PyPI reject an upload outright.
[project]
name = "atp-adapters"
classifiers = ["Private :: Do Not Upload"]
version = "1.0.0"
description = "Agent adapters for ATP Agent Test Platform"
requires-python = ">=3.12"
dependencies = [
    "atp-core>=1.0.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.42.39"]
vertex = ["google-cloud-aiplatform>=1.135.0"]
azure-openai = ["openai>=2.15.0"]
cloud = [
    "atp-adapters[bedrock,vertex,azure-openai]",
]
dev = [
    "pytest>=8.0",
    "pytest-anyio>=0.0.0",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atp"]

[tool.uv.sources]
atp-core = { workspace = true }

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
