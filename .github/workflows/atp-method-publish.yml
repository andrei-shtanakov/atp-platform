name: Publish atp-method to PyPI

on:
  push:
    tags:
      - "atp-method-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build atp-method
        run: cd packages/atp-method && uv build --out-dir dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2: release/v1 is a mutable ref on the privileged publish path (R-2 baseline 2026-08-25, owner decision 2026-08-27)
        with:
          packages-dir: packages/atp-method/dist/
          # Idempotent: re-pushing an existing tag (e.g. retroactive tagging
          # of an already-published version) must not fail the workflow.
          skip-existing: true
