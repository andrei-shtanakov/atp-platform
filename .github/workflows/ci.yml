name: CI

on:
  push:
    branches: [main, master, develop, "task/*"]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run ruff format check
        run: |
          uv run ruff format --check .

      - name: Run ruff lint
        run: |
          uv run ruff check .

      - name: Run pyrefly type check
        run: |
          uv run pyrefly check

      - name: Run tests with coverage
        # Exclude ``slow`` tests — these need real uvicorn + FastMCP SSE or
        # a container registry, which flake in GitHub Actions runners
        # (LABS-20/74). They run in the dedicated ``tournament-e2e`` job
        # below; locally, run them via ``pytest -m slow``.
        run: |
          uv run pytest tests/ -v -m "not slow" --cov=atp --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true


  tournament-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Sync deps
        run: uv sync --all-packages --all-extras --group dev
      - name: Tournament unit tests + static guards
        env:
          COVERAGE_FILE: .coverage.tournament-unit
        run: >-
          uv run pytest tests/unit/dashboard/tournament
          tests/unit/dashboard/mcp
          tests/unit/dashboard/migrations
          -v --cov=atp.dashboard.tournament
          --cov-report=xml
        timeout-minutes: 2
      - name: Upload tournament unit coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tournament-unit-coverage
          path: .coverage.tournament-unit
          if-no-files-found: error
          include-hidden-files: true

  tournament-integration:
    runs-on: ubuntu-latest
    needs: tournament-unit
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Sync deps
        run: uv sync --all-packages --all-extras --group dev
      - name: Tournament integration tests
        env:
          COVERAGE_FILE: .coverage.tournament-integration
        run: >-
          uv run pytest tests/integration/dashboard/tournament
          -v --cov=atp.dashboard.tournament
          --cov-report=xml
        timeout-minutes: 10
      - name: Upload tournament integration coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tournament-integration-coverage
          path: .coverage.tournament-integration
          if-no-files-found: error
          include-hidden-files: true

  tournament-e2e:
    runs-on: ubuntu-latest
    needs: tournament-integration
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'tournament-e2e')
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Sync deps
        run: uv sync --all-packages --all-extras --group dev
      - name: Tournament e2e tests
        env:
          COVERAGE_FILE: .coverage.tournament-e2e
        run: >-
          uv run pytest tests/e2e/dashboard/tournament
          -v
          --cov=atp.dashboard.tournament
          --cov-report=xml
        timeout-minutes: 15
      - name: Upload tournament e2e coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tournament-e2e-coverage
          path: .coverage.tournament-e2e
          if-no-files-found: error
          include-hidden-files: true

  tournament-coverage-gate:
    runs-on: ubuntu-latest
    needs: [tournament-unit, tournament-integration]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Sync deps
        run: uv sync --all-packages --all-extras --group dev
      - name: Download tournament unit coverage data
        uses: actions/download-artifact@v8
        with:
          name: tournament-unit-coverage
          path: .coverage-artifacts/unit
      - name: Download tournament integration coverage data
        uses: actions/download-artifact@v8
        with:
          name: tournament-integration-coverage
          path: .coverage-artifacts/integration
      - name: Combine tournament coverage data
        run: >-
          uv run coverage combine
          .coverage-artifacts/unit/.coverage.tournament-unit
          .coverage-artifacts/integration/.coverage.tournament-integration
      - name: Enforce 80% coverage floor on tournament package
        # Floor history: 85 (original) → 83 (LABS-74 middleware refactor)
        # → 80 (LABS-TSA PR-4 added builtins.py, roster plumbing, runner
        # branch, and concurrent-cap validator; restore to 83 once those
        # paths pick up dedicated tests in a follow-up).
        run: uv run coverage report --fail-under=80

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Check formatting
        run: |
          uv run ruff format --check .

      - name: Check linting
        run: |
          uv run ruff check .

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build production Docker image
        run: docker compose -f deploy/docker-compose.yml build platform

      - name: Start platform container
        env:
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          ATP_DISABLE_AUTH: "true"
        run: |
          docker compose -f deploy/docker-compose.yml up -d platform
          # Wait for container to become healthy (up to 60s)
          for i in $(seq 1 12); do
            if curl -sf http://localhost:8080/api/health > /dev/null 2>&1; then
              echo "Health check passed on attempt $i"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed after 60s"
          docker compose -f deploy/docker-compose.yml logs platform
          exit 1

      - name: Teardown
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  wheel-install:
    # Guards the failure that shipped 2.1.0 uninstallable. `[tool.uv.sources]`
    # resolves atp-core / atp-adapters / atp-platform-sdk from the workspace, so
    # every `uv sync` job above is green even when the published metadata names a
    # distribution that does not exist on PyPI (or, worse, an unrelated project
    # squatting the name). This job installs the built wheel into a clean venv
    # OUTSIDE the repo, where only PyPI can satisfy the metadata.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build wheel
        run: uv build --out-dir "$RUNNER_TEMP/dist"

      - name: Install the wheel resolving from PyPI only
        working-directory: ${{ runner.temp }}
        run: |
          uv venv -p 3.12 "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" \
            "$RUNNER_TEMP"/dist/atp_platform-*.whl

      - name: Smoke-test the installed CLI
        working-directory: ${{ runner.temp }}
        run: |
          cp "$GITHUB_WORKSPACE/examples/test_suites/01_smoke_tests.yaml" .
          "$RUNNER_TEMP/wheel-venv/bin/atp" --version
          "$RUNNER_TEMP/wheel-venv/bin/atp" list-agents
          "$RUNNER_TEMP/wheel-venv/bin/atp" validate --suite=01_smoke_tests.yaml

      # The CLI entrypoint alone would leave most of the base dependencies
      # unexercised, and they exist for the bundled members' code: the runner,
      # the evaluators, the adapters and the whole dashboard/server stack. A
      # requirement missing for any of those is an ImportError for a user and
      # nothing at all for `atp --version`.
      - name: Import every bundled stack
        working-directory: ${{ runner.temp }}
        env:
          ATP_SERVER_PROFILE: eco
        run: |
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          import importlib

          modules = [
              "atp.protocol",
              "atp.core.results",
              "atp.core.telemetry",
              "atp.core.metrics",
              "atp.loader.loader",
              "atp.model_catalog",
              "atp.scoring",
              "atp.statistics",
              "atp.streaming",
              "atp.chaos",
              "atp.adapters",
              "atp.adapters.http",
              "atp.adapters.cli",
              "atp.adapters.container",
              "atp.runner.orchestrator",
              "atp.evaluators.registry",
              "atp.reporters.registry",
              "atp.baseline",
              "atp.generator",
              "atp.performance",
              "atp.plugins",
              "atp.sdk",
              "atp.tracing",
              "atp.analytics.estimator",
              "atp.test_catalog.repository",
              "atp.dashboard",
              "atp.dashboard.v2.factory",
              "atp.server",
          ]
          for name in modules:
              importlib.import_module(name)
          print(f"imported {len(modules)} modules")
          PY

      # Extras come from the built wheel's own metadata rather than a list
      # maintained here, so a newly declared extra cannot go unchecked and an
      # alias kept for compatibility (`eco-server`, now empty) is still proven
      # to resolve.
      - name: Resolve every declared extra
        working-directory: ${{ runner.temp }}
        run: |
          wheel=$(echo "$RUNNER_TEMP"/dist/atp_platform-*.whl)
          extras=$("$RUNNER_TEMP/wheel-venv/bin/python" - "$wheel" <<'PY'
          import sys, zipfile
          from email.parser import BytesParser

          with zipfile.ZipFile(sys.argv[1]) as archive:
              name = next(n for n in archive.namelist() if n.endswith(".dist-info/METADATA"))
              metadata = BytesParser().parsebytes(archive.read(name))
          print(" ".join(metadata.get_all("Provides-Extra") or []))
          PY
          )
          test -n "$extras" || { echo "no extras found in wheel metadata"; exit 1; }
          echo "extras: $extras"
          for extra in $extras; do
            echo "::group::extra $extra"
            uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" \
              --dry-run "atp-platform[$extra] @ $wheel"
            echo "::endgroup::"
          done

  plan-owners:
    # Existence of a GitHub login/team needs the network, so it is deliberately
    # NOT in the pre-commit hook (which must stay usable offline). The hook
    # checks tag *form*; this job checks that the handles resolve.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve @owner handles against GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Handles come from the same parser the hook uses. Re-extracting them
          # with a shell regex would silently truncate a handle at the first
          # character the class omits and then validate a different account.
          python3 scripts/ci/check_plan_citations.py --print-owners > handles.txt
          cat handles.txt
          rc=0
          while read -r kind value; do
            [ -n "${kind:-}" ] || continue
            case "$kind" in
              user)
                if gh api "users/$value" >/dev/null 2>&1; then
                  echo "ok   user $value"
                else
                  echo "FAIL user $value does not resolve"; rc=1
                fi
                ;;
              team)
                org=${value%%/*}; slug=${value##*/}
                if gh api "orgs/$org/teams/$slug" >/dev/null 2>&1; then
                  echo "ok   team $value"
                else
                  # A team lookup needs org scope the default token may lack;
                  # report it rather than failing on a permissions gap.
                  echo "WARN team $value unresolved (token may lack org scope)"
                fi
                ;;
            esac
          done < handles.txt
          exit $rc

  # Copy-integrity вендор-копии codex-review-кита (продюсер — steward).
  # Бутстрап-контракт кита (шапка checksum.sh): чекер обязан исполняться
  # ИЗВЛЕЧЁННЫМ ИЗ BASE — иначе PR, правящий checksum.sh вместе с его
  # строкой PIN, глушит проверку, которую сам же исполняет. Первый PR кита —
  # детекция: чекера в base ещё нет, целостность держится на ревью самого
  # PR, после мержа проверка включается сама. Вторая гарантия
  # (upstream-drift) — отдельная вахта review-kit-drift.yml, не PR-гейт.
  review-kit-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: checksum.sh из base против дерева PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail
          if git cat-file -e "$BASE_SHA:scripts/review/checksum.sh" 2>/dev/null; then
            # Обычный файл, не симлинк — тот же страж, что у извлечения
            # механики codex-review из base у продюсера.
            mode=$(git ls-tree "$BASE_SHA" -- scripts/review/checksum.sh | cut -d' ' -f1)
            case "$mode" in
              100644|100755) ;;
              *)
                echo "::error::checksum.sh в base — не обычный файл (режим $mode)"
                exit 1 ;;
            esac
            mkdir -p "$RUNNER_TEMP/trusted-kit"
            git show "$BASE_SHA:scripts/review/checksum.sh" \
              > "$RUNNER_TEMP/trusted-kit/checksum.sh"
            sh "$RUNNER_TEMP/trusted-kit/checksum.sh" \
              --pin scripts/review/PIN --root .
          else
            echo "::notice::бутстрап: checksum.sh в base ещё нет —" \
              "целостность этого PR держится на его ревью; после мержа" \
              "чекер из base включится сам."
          fi
