# Vendored pinned contract copies must stay byte-identical to what the owning
# repo published (their sha256 manifests are the pin surface), and some of their
# fixtures are deliberately malformed. Formatting/validating hooks skip them.
exclude: ^tests/unit/model_catalog/fixtures/catalog-conformance/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: plan-citations
        name: plan citation check (TODO.md / CLAUDE.md)
        entry: uv run python scripts/ci/check_plan_citations.py
        language: system
        files: ^(TODO|CLAUDE)\.md$
        pass_filenames: false

      - id: pyrefly
        name: pyrefly type check
        entry: bash -c 'uv run pyrefly check'
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
